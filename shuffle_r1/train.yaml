data:
  train_files: /content/shuffle-r1-formal/data/train.parquet
  val_files: /content/shuffle-r1-formal/data/dev.parquet
  split_manifest: /content/shuffle-r1-formal/data/split_manifest.json
  dataloader_num_workers: 0
  prompt_key: problem
  answer_key: answer
  image_key: images
  max_prompt_length: 2048
  max_response_length: 2048
  rollout_batch_size: 512
  val_batch_size: 16
  shuffle: true
  seed: 1
  max_pixels: 1000000
  min_pixels: 262144
  system_prompt: |-
    You FIRST think about the reasoning process as an internal monologue and then provide the final answer.
     The reasoning process MUST BE enclosed within <think> </think> tags. The final answer MUST BE put in \boxed{}.

algorithm:
  adv_estimator: pairwise_purning
  disable_kl: true
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.0

worker:
  actor:
    global_batch_size: 128
    micro_batch_size_per_device_for_update: 1
    reference_micro_batch_size_for_update: 4
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    clip_ratio: 0.2
    ppo_epochs: 1
    padding_free: true
    use_torch_compile: false
    ulysses_sequence_parallel_size: 1
    purning_ratio: 0.5
    model:
      model_path: /content/shuffle-r1-formal/model-snapshot
      tokenizer_path: /content/shuffle-r1-formal/model-snapshot
      revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: true
    optim:
      strategy: adamw
      lr: 1.0e-6
      betas: [0.9, 0.999]
      weight_decay: 0.01
      lr_warmup_ratio: 0.0
      warmup_style: constant
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      use_orig_params: true
      torch_dtype: fp32
      mp_param_dtype: bf16
      mp_reduce_dtype: fp32
      mp_buffer_dtype: fp32
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 16
    temperature: 1.0
    top_p: 0.99
    top_k: -1
    dtype: bf16
    tensor_parallel_size: 1
    rollout_chunk_prompts: 16
    gpu_memory_utilization: 0.50
    enforce_eager: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 8192
    max_num_seqs: 64
    limit_images: 1
    val_override_config:
      temperature: 0.0
      n: 1

  reward:
    reward_type: function
    compute_score: math

trainer:
  nnodes: 1
  n_gpus_per_node: 1
  project_name: p3_shuffle_clean
  experiment_name: qwen25vl3b_b512_seed1
  logger: [console]
  total_episodes: 20
  max_steps: 150
  reference_data_parallel_size: 8
  reference_micro_batch_size: 4
  selection_mode: pairwise
  experience_replay: true
  replay_times: 8
  sampling_method: power
  sampling_coeff: 1
  sampling_weight: sum
  val_before_train: true
  val_freq: 25
  val_generations_to_log: 0
  save_freq: 1
  save_limit: 2
  save_checkpoint_path: /content/shuffle-r1-formal/checkpoints/qwen25vl3b_b512_seed1
  load_checkpoint_path: null
  require_driver_rng_checkpoint: true
  require_checkpoint_manifest: true
  checkpoint_model_revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
